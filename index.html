<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dream Catcher">
<meta name="theme-color" content="#2f5d50">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 52'%3E%3Crect width='40' height='52' rx='8' fill='%232f5d50'/%3E%3Cg fill='none' stroke='white' stroke-width='2'%3E%3Ccircle cx='20' cy='18' r='12'/%3E%3Cpath d='M20 6 30 12 30 24 20 30 10 24 10 12Z M10 28 9 40M20 30V44M30 28 31 40'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 52'%3E%3Crect width='40' height='52' fill='%232f5d50'/%3E%3Cg fill='none' stroke='white' stroke-width='2'%3E%3Ccircle cx='20' cy='18' r='12'/%3E%3Cpath d='M20 6 30 12 30 24 20 30 10 24 10 12Z M10 28 9 40M20 30V44M30 28 31 40'/%3E%3C/g%3E%3C/svg%3E">
<title>Dream Catcher</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1b;--sub:#6b6a66;--line:#e4e1d9;--acc:#2f5d50;--acc2:#e8f0ec;--warn:#b5482f}
html[data-skin=pop]{--bg:#fff8ec;--card:#fff;--ink:#2b2340;--sub:#7a6f8a;--line:#f3e2cc;--acc:#ff4f87;--acc2:#ffe4ee;--warn:#ff7a00}
html[data-skin=gold]{--bg:#121010;--card:#1d1a17;--ink:#f3e9d2;--sub:#b8a98a;--line:#3a322a;--acc:#d4af37;--acc2:#2c2618;--warn:#e0704f}
html[data-skin=ocean]{--bg:#eef5fb;--card:#fff;--ink:#13293d;--sub:#5d7184;--line:#d6e4f0;--acc:#1e6fb8;--acc2:#e0edf9;--warn:#d9534f}
html[data-skin=sakura]{--bg:#fdf4f5;--card:#fff;--ink:#3d2a2e;--sub:#8a6f75;--line:#f0dde1;--acc:#c25b7a;--acc2:#f9e1e8;--warn:#c0392b}
html[data-skin=night]{--bg:#0f1115;--card:#181b21;--ink:#e8eaed;--sub:#9aa0a6;--line:#2a2e36;--acc:#8ab4f8;--acc2:#1d2633;--warn:#f28b82}
html[data-skin=gold] h1,html[data-skin=gold] .vision{color:var(--acc)}
html[data-skin=gold] body{background:radial-gradient(circle at 20% 0,#2a2218,var(--bg) 60%)}
html[data-skin=pop] body{background:linear-gradient(160deg,#fff8ec,#ffeef5 50%,#eefaff)}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#211f1d;--ink:#eceae4;--sub:#9a978f;--line:#34322e;--acc:#7fbfa8;--acc2:#24302b;--warn:#e07a5f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:.06em;display:flex;align-items:center;gap:8px;color:var(--acc);font-family:Georgia,'Hiragino Mincho ProN',serif}
.logo{width:28px;height:36px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:6px 12px;border-radius:6px;color:var(--sub);cursor:pointer;font:inherit}
nav button.on{background:var(--acc2);color:var(--acc);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
h2{font-size:15px;margin:28px 0 10px;color:var(--sub);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
textarea{width:100%;min-height:70px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:160px}
.row select{max-width:100%}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:600}
.ghost{background:none;border:1px solid var(--line);color:var(--sub);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
.x{background:none;border:0;color:var(--sub);cursor:pointer;font-size:16px}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.task.done .t{text-decoration:line-through;color:var(--sub)}
.t{flex:1;min-width:8em}
.rp{font:inherit;font-size:12px;padding:3px 8px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:6px;cursor:pointer;white-space:nowrap}.rp.on{color:var(--acc);border-color:var(--acc);font-weight:700}
.rpp{flex-basis:100%;background:var(--acc2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.wdb{font:inherit;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.wdb.sun{color:var(--warn)}.wdb.sat{color:#3b6fb6}
.wdb.on{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:700}
.st{font-size:12px;white-space:nowrap;color:var(--sub);min-width:5.5em}
.sb{font:inherit;font-size:13px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.sb.on2{border-color:#d69e2e;background:#fdf3dc;color:#9c6b12;font-weight:700}
.sb.on{border-color:var(--acc);background:var(--acc);color:var(--bg);font-weight:700}
.task.started{background:linear-gradient(90deg,#fdf3dc55,transparent)}
.task{flex-wrap:wrap}
.tag{max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;color:var(--acc);background:var(--acc2);padding:1px 8px;border-radius:99px}
.due{font-size:12px;color:var(--sub)}.due.late{color:var(--warn)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--acc)}
.mit{border-left:4px solid var(--acc)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4 .card{min-height:160px}
.grid4 h3{margin:0 0 6px;font-size:14px}
.hab{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.hd{display:flex;flex-direction:column;align-items:center;width:30px}
.hd small{font-size:10px;color:var(--sub);line-height:1.3}
.hd.sun small{color:var(--warn)}.hd.sat small{color:#3b6fb6}
.hd.td small{color:var(--acc);font-weight:700}
.hd.td span{outline:2px solid var(--acc);outline-offset:1px}
.hab span{width:26px;height:26px;border-radius:5px;background:var(--line);cursor:pointer;margin-top:2px}
.hab span.fut{opacity:.4}
.hab span.on{background:var(--acc)}
.muted{color:var(--sub);font-size:13px}
.vision{font-size:20px;font-weight:600;line-height:1.5}
.mm{overflow-x:auto;padding:10px 0}
.mm ul{list-style:none;margin:0;padding-left:28px;position:relative}
.mm>ul{padding-left:0}
.mm li{position:relative;padding:5px 0 5px 18px}
.mm ul ul li::before{content:'';position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line)}
.mm ul ul li:last-child::before{bottom:50%}
.mm ul ul li::after{content:'';position:absolute;left:0;top:50%;width:16px;border-top:2px solid var(--line)}
.mm li>ul>li{animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateX(-8px)}}
.nd{display:inline-flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 14px;cursor:pointer;user-select:none}
.nd.root{background:var(--acc);color:var(--bg);font-weight:700;font-size:16px;border:0}
.nd.goal{border:2px solid var(--acc);font-weight:600}
.nd.kr{border-style:dashed}
.pen{opacity:.35;cursor:pointer;font-size:12px;padding:0 3px}
.nd:hover .pen,.task:hover .pen,strong:hover .pen{opacity:1}
.nd.root .pen,.nd.root .muted{color:inherit;opacity:.85}
.nd.why{font-size:12px;color:var(--sub);background:none;border-style:dotted}
input.ed{font-size:14px;padding:3px 8px;min-width:200px;border:1.5px solid var(--acc)}
@media(hover:none){.pen{opacity:.7}}
.nd-date{border:0!important;background:none!important;color:var(--sub)!important;font-size:12px!important;padding:0!important;width:auto;cursor:pointer}
.cd{font-size:11px;font-weight:700;color:var(--acc);background:var(--acc2);border-radius:99px;padding:0 8px}.cd.soon{color:#b7791f;background:#fdf3dc}.cd.late{color:#fff;background:var(--warn)}
.mm li>input[type=date]{min-width:0;border-radius:6px;padding:4px 6px}
.nd.short{background:var(--card);border-style:dashed}
.lv{font-size:11px;padding:0 6px;border-radius:4px;background:var(--acc);color:var(--bg);font-weight:700}
.nd.root .lv{display:none}
.nr{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.nr>.wp{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr));gap:6px;flex:1;min-width:300px;padding:10px;background:var(--card);border:1px solid var(--acc);border-radius:10px;max-width:560px}
.wp label{display:flex;flex-direction:column;font-size:11px;color:var(--sub)}
.wp input{padding:4px 8px;font-size:13px}
@media(max-width:700px){.nr>.wp{grid-template-columns:1fr 1fr}}
.nd .del{color:var(--sub);opacity:.35;padding:0 2px;font-size:14px}
.nd:hover .del{opacity:1}.nd .del:hover{color:var(--warn)}
.mm li>input{border:1.5px dashed var(--acc);border-radius:99px;background:none;min-width:220px}
.nd.sub{border:1.5px solid var(--acc);background:var(--acc2);color:var(--acc);font-weight:600}
.nd.done{opacity:.5;text-decoration:line-through}
.nd .c{font-size:12px;color:var(--sub)}
.nd.root .c{color:inherit}
.drag{cursor:grab;background:var(--card)}.dragging{opacity:.4}.drop.over{outline:2px dashed var(--acc);background:var(--acc2)}
.wbs{width:100%;border-collapse:collapse;table-layout:auto}
.wbs td:first-child{overflow-wrap:anywhere;min-width:12em}
.wbs td:nth-child(n+2){white-space:nowrap;width:1%}
.wbs .tag{max-width:9em}
.wbs th{text-align:left;font-size:13px;color:var(--sub);padding:10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
.wbs th.on{color:var(--acc)}
.wbs td{padding:6px 10px;border-bottom:1px solid var(--line)}
.wbs tr.grp td{background:var(--acc2);font-weight:600;color:var(--acc)}
.wbs tr.done .t{text-decoration:line-through;color:var(--sub)}
.wbs input.late{color:var(--warn)}
.wbs select,.wbs input[type=date]{padding:3px 6px;font-size:13px}
.arm{color:#fff!important;background:var(--warn)!important;opacity:1!important;border-radius:99px;padding:0 8px!important;font-size:12px!important}
@media(max-width:600px){.grid4{grid-template-columns:1fr}}

@media(max-width:600px){
  header{padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
  h1{font-size:16px}.logo{width:22px;height:28px}
  header>.ghost{font-size:11px;padding:3px 8px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateZ(0);-webkit-transform:translateZ(0);background:var(--card);border-top:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;gap:0;padding:4px 4px max(6px,env(safe-area-inset-bottom));box-shadow:0 -4px 16px #0001;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;font-size:12px;padding:8px 10px;border-radius:8px;white-space:nowrap}
  main{padding:12px 12px 110px}
  input,select,textarea{font-size:16px}
  .card{padding:12px}
  .row>input.grow,.row>select{width:100%}
  .task{gap:8px;padding:10px 0}
  .task input[type=checkbox]{width:22px;height:22px}
  .sb{padding:8px 12px;font-size:14px}
  .ghost{padding:6px 10px}
  .x{font-size:20px;padding:4px 8px}
  .vision{font-size:17px}
  .grid4{gap:8px}.grid4 .card{min-height:0}
  .hd{width:calc((100% - 24px)/7)}.hab span{width:100%;height:30px}
  .mm ul{padding-left:14px}.mm li{padding-left:12px}.mm ul ul li::after{width:10px}
  .nd{font-size:13px;padding:6px 10px;flex-wrap:wrap;border-radius:12px}
  .mm li>input{min-width:0;width:100%}
}
.qsel{font-size:12px;padding:2px 4px}
.hd.blank{display:none}
@media(max-width:600px){.hd.blank{display:flex}}
@media(hover:hover){.qsel{display:none}}
.sbar{background:#fdf3dc;color:#7a5410;font-size:13px;padding:8px 16px;text-align:center}.sbar a{color:inherit;font-weight:700;margin-left:8px}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.tlcol{position:sticky;top:70px}
.tlhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:28px}
.tl{height:min(70vh,640px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;position:relative}
.tl.over{outline:2px dashed var(--acc);background:var(--acc2)}
.tlg{position:relative;margin-left:44px;margin-right:6px}
.hr{position:absolute;left:-44px;right:0;border-top:1px solid var(--line);height:0}
.hr span{position:absolute;left:4px;top:-8px;font-size:11px;color:var(--sub);background:var(--card);padding-right:4px}
.now{position:absolute;left:-6px;right:0;border-top:2px solid var(--warn);z-index:3}
.now::before{content:'';position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.blk{position:absolute;left:2px;right:2px;background:var(--acc);color:var(--bg);border-radius:6px;padding:2px 22px 2px 8px;font-size:12px;overflow:hidden;cursor:grab;touch-action:none;z-index:2;box-shadow:0 1px 3px #0002;display:flex;flex-direction:column;line-height:1.3}
.blk.done{opacity:.5;text-decoration:line-through}
.blk b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk small{opacity:.85;font-size:11px}
.blk.gev{background:color-mix(in srgb,var(--gc) 22%,var(--card));border-left:4px solid var(--gc);color:var(--ink);cursor:default;z-index:1;opacity:.9;padding-right:6px}
.bx{position:absolute;top:1px;right:5px;cursor:pointer;font-size:14px;opacity:.8}
.rz{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize;touch-action:none}
.rz::after{content:'';position:absolute;left:50%;bottom:2px;width:22px;margin-left:-11px;border-top:2px solid #fff8}
.grip{cursor:grab;touch-action:none;color:var(--sub);font-size:18px;padding:0 4px;user-select:none}
.grip:hover{color:var(--acc)}
.ghost-drag{position:fixed;z-index:99;pointer-events:none;background:var(--acc);color:var(--bg);padding:6px 12px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px #0003;max-width:240px}
.tm{font-size:12px;color:var(--acc);font-weight:600}
.gc{font-size:12px;color:var(--acc);font-weight:600}
.allday{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;font-size:12px}.allday span{background:var(--acc2);padding:2px 8px;border-radius:6px}
@media(max-width:860px){.tgrid{grid-template-columns:1fr}.tlcol{position:static}.tl{height:60vh}}
.tpb{padding:4px 8px}
.tpp{position:fixed;z-index:60;right:20px;bottom:20px;width:340px;max-width:calc(100vw - 24px);box-shadow:0 10px 30px #0003;background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.blk.short{flex-direction:row;align-items:center;gap:6px;padding-top:0;padding-bottom:0;font-size:11.5px}
.blk.short b{flex:0 1 auto;min-width:0}.blk.short small{flex:none;font-size:10.5px}
.blk.short .bx{top:50%;transform:translateY(-50%)}.blk.short .rz{height:5px}
.task.hascat{border-left:4px solid var(--cat);padding-left:8px}
.nd.hascat{border-left:5px solid var(--cat)}
.cb{font:inherit;font-size:12px;padding:3px 8px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;cursor:pointer;white-space:nowrap}
.cb.on{border-color:var(--cat);color:var(--cat);font-weight:700}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cat);margin-right:4px;vertical-align:middle}
.qb{font-size:14px;font-weight:700;margin-right:4px;color:var(--sub)}
.qb.q1{color:var(--warn)}.qb.q2{color:var(--acc)}
.blk .qb{color:inherit}
.gear{white-space:nowrap}
.modal{position:fixed;inset:0;background:#0006;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--card);color:var(--ink);border-radius:14px;padding:18px 20px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px #0004}
.mbox h3{font-size:14px;margin:16px 0 8px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.skin{font:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
.skin.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.skin .sw{width:100%;height:42px;border-radius:6px;border:1px solid #0001}
.skin small{color:var(--sub);font-size:11px}
.otabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.otabs button{font:inherit;font-size:13px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:6px 14px;cursor:pointer}
.otabs button.on{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:700}
.card h3{margin:0 0 6px;font-size:15px}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.vb{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.vb figure{margin:0;position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.vb figcaption input{width:100%;border:0;border-radius:0;font-size:13px}
.vbx{position:absolute;top:4px;right:4px;background:#0008!important;color:#fff!important;border-radius:50%;width:28px;height:28px;padding:0!important;font-size:16px!important}
.vbadd{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;border:2px dashed var(--acc);border-radius:10px;color:var(--acc);font-weight:700;cursor:pointer;background:var(--acc2)}
.l100{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 12px}
@media(min-width:1000px){.l100{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(25,auto);grid-auto-flow:column}.h100{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(25,auto);grid-auto-flow:column}}
.li,.hi{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:2px 0}
.li .no,.hi .no{width:3em;text-align:right;font-size:12px;color:var(--sub);flex:none}
.li input:not([type=checkbox]),.hi input{flex:1;min-width:0;border:0;background:transparent;padding:6px 4px}
.li.done input:not([type=checkbox]){text-decoration:line-through;color:var(--sub)}
.h100{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 14px}
.hi .no{width:4.2em;display:flex;flex-direction:column;line-height:1.1}.hi .no small{font-size:10px;opacity:.7}
.hi.past{opacity:.75}.hi.cur{background:var(--acc2);border-radius:6px}.hi.cur .no{color:var(--acc);font-weight:700}
.pk .pname{font-size:17px;font-weight:700;width:100%}
.ptbl{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:10px 0}
.ph,.pr{display:grid;grid-template-columns:7.5em 1fr 1fr}
.ph span{background:var(--acc2);color:var(--acc);font-size:12px;font-weight:700;padding:6px 8px}
.pr{border-top:1px solid var(--line)}.pr>span{font-size:12px;padding:8px;background:var(--bg);display:flex;align-items:center}
.pr textarea{border:0;border-left:1px solid var(--line);border-radius:0;min-height:44px;resize:vertical;font-size:13px}
.act{margin:4px 0}.act.done input.grow{text-decoration:line-through;color:var(--sub)}
.dleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--sub)}.dleg b{color:var(--acc)}

<body>
<header><h1><svg class="logo" viewBox="0 0 40 52" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="20" cy="18" r="15"/><path stroke-width=".9" d="M20 3 33 11 33 25 20 33 7 25 7 11Z M20 9 28 14 28 22 20 27 12 22 12 14Z M20 3V9M33 11 28 14M33 25 28 22M20 33V27M7 25 12 22M7 11 12 14"/><path d="M8 29 6 39M20 33V43M32 29 34 39"/></g><circle cx="20" cy="18" r="2.2" fill="currentColor"/><g fill="currentColor"><path d="M6 39c-2 2-2 7 0 10 2-3 2-8 0-10Z"/><path d="M20 43c-2 2-2 6 0 9 2-3 2-7 0-9Z"/><path d="M34 39c-2 2-2 7 0 10 2-3 2-8 0-10Z"/></g></svg>Dream Catcher</h1><nav id="nav"></nav><span id="acct" style="margin-left:auto;display:flex;gap:6px;align-items:center"></span><button class="ghost gear" title="設定" onclick="openSet()">⚙ 設定</button><a class="ghost" id="sbtn" href="?sample=1" target="_blank" rel="noopener" style="text-decoration:none">サンプルを見る ↗</a></header>
<main id="app"></main>
<script>
const KEY='northstar-v1';
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{vision:'',goals:[],tasks:[],habits:[],reviews:[]};
const SAMPLE=new URLSearchParams(location.search).has('sample');
const save=()=>{if(SAMPLE){render();return}S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();pushSoon()};
const id=()=>Math.random().toString(36).slice(2,9);
const newId=()=>id();
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS={map:'目標マインドマップ',goals:'目標',today:'今日',cal:'カレンダー',inbox:'タスク管理',matrix:'優先度',wbs:'一覧(WBS)',habits:'習慣',review:'週次レビュー',other:'その他'};
let tab='map';let HM=today().slice(0,7);let SORT='goal',SHOWDONE=true;const OPEN=new Set();

function goalName(gid){const g=S.goals.find(g=>g.id==gid);return g?g.title:''}
function subName(t){const g=S.goals.find(g=>g.id==t.goal),sb=g&&(g.subs||[]).find(x=>x.id==t.sub);return sb?' › '+sb.title:''}
function goalProgress(g){
  if(g.krs.length){return Math.round(g.krs.reduce((a,k)=>a+Math.min(1,k.cur/(k.target||1)),0)/g.krs.length*100)}
  const ts=S.tasks.filter(t=>t.goal==g.id);return ts.length?Math.round(ts.filter(t=>t.done).length/ts.length*100):0;
}
function todayRow(t){
  const st=t.done?'done':t.started?'started':'';
  return `<div class="task ${t.done?'done':''} ${st} ${t.cat?'hascat':''}" ${catStyle(t)}><span class="grip" title="ドラッグしてカレンダーへ" onpointerdown="dstart(event,'${t.id}','new')">⠿</span><span class="st">${t.done?'✅ 完了':t.started?'🔶 着手中':'⬜ 未着手'}</span>
   <span class="t">${qb(t)}${ed('t',t.id,t.title)}${t.repeat?` <span class="muted">${repLabel(t)}</span>`:''}${slotOn(t)?` <span class="tm">🕘 ${fm(t.slot.start)}–${fm(t.slot.end)}</span>`:''}</span>${t.goal?`<span class="tag">${esc(goalName(t.goal))}</span>`:''}
   <button class="sb ${t.started&&!t.done?'on2':''}" onclick="start('${t.id}')" title="手をつけた">🤚</button>
   <button class="sb ${t.done?'on':''}" onclick="toggle('${t.id}')" title="完全にできた">☑️</button>
   ${slotOn(t)?`<button class="sb tpb" title="時間を選び直す" onclick="openTP('${t.id}')">時間変更</button>`:`<button class="sb addb" title="空いている時間にカレンダーへ追加" onclick="quickSlot('${t.id}')">追加</button>`}
   ${catBtn(t)}
   <button class="sb backb" title="今日から外してタスク管理のリストに戻す" onclick="mit('${t.id}')">リストに戻す</button></div>`}
function start(i){const t=S.tasks.find(t=>t.id==i);if(t.done){t.done=false;t.doneAt=''}t.started=t.started?'':today();save()}
let EDIT='';
const CATS={work:['仕事','#d64545'],private:['プライベート','#e0b100'],daily:['デイリー','#3b7dd8'],task:['タスク','#2e9e5b']};
const QN=['','①','②','③','④'];
function qOf(t){return t.important&&t.urgent?1:t.important?2:t.urgent?3:4}
function dueTxt(d,done){const x=new Date(d+'T00:00'),n=Math.round((x-new Date(today()+'T00:00'))/864e5),WD='日月火水木金土';
  const md=`${x.getMonth()+1}月${x.getDate()}日(${WD[x.getDay()]})`;if(done)return md;
  return `${md} <b class="dl ${n<0?'over':n<=3?'soon':''}">${n<0?(-n)+'日超過':n==0?'今日まで':'あと'+n+'日'}</b>`}
function qb(t){return `<span class="qb q${qOf(t)}" title="第${qOf(t)}象限">${QN[qOf(t)]}</span>`}
function catStyle(t){return t.cat&&CATS[t.cat]?`style="--cat:${CATS[t.cat][1]}"`:''}
function catBtn(t){const c=CATS[t.cat];return `<button class="cb ${c?'on':''}" ${catStyle(t)} title="色分け（押すたびに切替）" onclick="cycCat('${t.id}')">${c?'● '+c[0]:'○ 色'}</button>`}
function qOpts(){return `<option value="0">象限：自動</option><option value="1">① 重要×緊急</option><option value="2">② 重要×緊急でない</option><option value="3">③ 重要でない×緊急</option><option value="4">④ 重要でない×緊急でない</option>`}
function catOpts(){return `<option value="">色なし</option>`+Object.entries(CATS).map(([k,[l]])=>`<option value="${k}">● ${l}</option>`).join('')}
function cycCat(i){const t=S.tasks.find(t=>t.id==i),ks=['',...Object.keys(CATS)];t.cat=ks[(ks.indexOf(t.cat||'')+1)%ks.length];save()}
function ed(kind,path,val,ph){const k=kind+':'+path;
  if(EDIT==k)return `<input class="ed" value="${esc(val)}" placeholder="${ph||''}" onclick="event.stopPropagation()" onkeydown="event.stopPropagation();if(ent(event))setVal('${kind}','${path}',this.value);if(event.key=='Escape'){EDIT='';render()}" onblur="setVal('${kind}','${path}',this.value)">`;
  return `${val?esc(val):`<span class="muted">${ph||''}</span>`}<span class="pen" title="編集" onclick="event.stopPropagation();EDIT='${k}';render();setTimeout(()=>{const e=document.querySelector('.ed');if(e){e.focus();e.select()}})">✎</span>`}
function setVal(kind,path,v){if(!EDIT)return;v=v.trim();EDIT='';const[a,b]=path.split('|'),g=S.goals.find(g=>g.id==a),sb=g&&b?(g.subs||[]).find(x=>x.id==b):null;
  if(kind=='vision')S.vision=v;
  else if(kind=='gt'&&v)g.title=v;
  else if(kind=='gw')g.why=v;
  else if(kind=='st'&&v)sb.title=v;
  else if(kind=='sw')sb.why=v;
  else if(kind=='kr'&&v)g.krs[+b].t=v;
  else if(kind=='t'&&v)S.tasks.find(t=>t.id==a).title=v;
  else if(kind=='h'&&v)S.habits.find(h=>h.id==a).title=v;
  save()}
function taskRow(t){
  const late=t.due&&t.due<today()&&!t.done;
  return `<div class="task ${t.done?'done':''} ${t.cat?'hascat':''}" ${catStyle(t)}>
   <input type="checkbox" ${t.done?'checked':''} onchange="toggle('${t.id}')">
   <span class="t">${qb(t)}${ed('t',t.id,t.title)}</span>
   ${t.goal?`<span class="tag">${esc(goalName(t.goal)+subName(t))}</span>`:''}
   ${t.due?`<span class="due ${late?'late':''}">${dueTxt(t.due,t.done)}</span>`:''}
   ${t.done?(t.repeat?`<span class="muted">${repLabel(t)}</span>`:''):`<button class="rp ${t.repeat?'on':''}" title="繰り返し設定" onclick="RPO=RPO=='${t.id}'?'':'${t.id}';render()">${t.repeat?repLabel(t):'🔁 繰り返し'}</button>`}
   <button class="ghost" onclick="mit('${t.id}')">${t.mit===today()?'★':'☆'}</button>
   ${catBtn(t)}
   <button class="x" onclick="if(ok(this))delTask('${t.id}')">×</button>${RPO==t.id&&!t.done?repPanel(t):''}</div>`;
}
function goalOpts(sel){return `<option value="">目標なし</option>`+S.goals.map(g=>`<option value="${g.id}" ${g.id==sel?'selected':''}>${esc(g.title)}</option>`+(g.subs||[]).map(sb=>`<option value="${g.id}|${sb.id}">　└ ${esc(sb.title)}</option>`).join('')).join('')}

const V={
map(){
  const node=(key,cls,label,extra,kids,side)=>{const has=kids&&kids.length,open=OPEN.has(key);
    return `<li><div class="nr"><span class="nd ${cls}" onclick="${has?`tog('${key}')`:''}">${label}${extra||''}${has?`<span class="c">${open?'−':'+'+kids.length}</span>`:''}</span>${side||''}</div>${has&&open?`<ul>${kids.join('')}</ul>`:''}</li>`};
  const W=[['who','誰が'],['what','何を'],['when','いつまでに'],['where','どこで'],['why','なぜ'],['how','どうやって']];
  const wbtn=(o,path)=>{const f=W.filter(([k])=>(o.w||{})[k]).length;return `<span class="wb ${f==6?'full':''}" onclick="event.stopPropagation();tog('w${o.id}')">5W1H ${f}/6</span>`};
  const wpanel=(o,path)=>OPEN.has('w'+o.id)?`<div class="wp">${W.map(([k,l])=>`<label><span>${l}</span><input ${k=='when'?'type="date"':''} value="${esc(k=='when'?dueOf(o):(o.w||{})[k])}" placeholder="${l}" onchange="setW('${path}','${k}',this.value)"></label>`).join('')}</div>`:'';
  const tnode=t=>`<li><span class="nd ${t.done?'done':''} ${t.cat?'hascat':''}" ${catStyle(t)}><input type="checkbox" ${t.done?'checked':''} onclick="event.stopPropagation()" onchange="toggle('${t.id}')">${qb(t)}${ed('t',t.id,t.title)}${t.due?`<span class="c">${t.due.slice(5)}</span>`:''}<span onclick="event.stopPropagation();mit('${t.id}')">${t.mit===today()?'★':'☆'}</span><span class="del" title="削除" onclick="event.stopPropagation();if(ok(this))delTask('${t.id}')">×</span></span></li>`;
  const goals=S.goals.map(g=>{const ts=S.tasks.filter(t=>t.goal==g.id).sort((a,b)=>a.done-b.done);
    const kids=[];
    kids.push(`<li><span class="nd why">なぜ：${ed('gw',g.id,g.why,'＋ なぜこの目標？を書く')}</span></li>`);
    if(g.krs.length)kids.push(node('k'+g.id,'kr','成果指標','',g.krs.map(k=>`<li><span class="nd kr">${ed('kr',g.id+'|'+g.krs.indexOf(k),k.t)}<span class="c">${k.cur}/${k.target}</span><span class="del" onclick="event.stopPropagation();if(ok(this))delKr('${g.id}',${g.krs.indexOf(k)})">×</span></span></li>`)));
    const subTree=(parent,lv)=>(g.subs||[]).filter(sb=>(sb.parent||'')==parent).map(sb=>{
      const st=ts.filter(t=>t.sub==sb.id),n=st.filter(t=>t.done).length,path=g.id+'|'+sb.id;
      const ch=[`<li><span class="nd why">なぜ：${ed('sw',path,sb.why,'＋ なぜ？を書く')}</span></li>`,...subTree(sb.id,lv+1),...st.map(tnode)];
      if(lv==1)ch.push(`<li><input placeholder="＋ 短期目標を追加して Enter" onkeydown="if(ent(event)){OPEN.add('${sb.id}');addSub('${g.id}',this.value,'${sb.id}',this.nextElementSibling.value)}"> <input type="date" title="いつまでに"></li>`);
      ch.push(`<li><input placeholder="＋ タスクを追加して Enter" onkeydown="if(ent(event)){OPEN.add('${sb.id}');addTask(this.value,'${path}')}"></li>`);
      return node(sb.id,lv==1?'sub':'sub short',`<span class="lv">${lv==1?'中期':'短期'}</span>`+ed('st',path,sb.title),`<span class="c">${n}/${st.length}</span><input type="date" class="nd-date" value="${dueOf(sb)}" onclick="event.stopPropagation()" onchange="setW('${path}','when',this.value)">${left(dueOf(sb))}<span class="del" title="削除" onclick="event.stopPropagation();if(ok(this))delSub('${g.id}','${sb.id}')">×</span>`,ch)});
    kids.push(...subTree('',1));
    const open=ts.filter(t=>!t.done&&!t.sub),done=ts.filter(t=>t.done&&!t.sub);
    kids.push(...open.map(tnode));
    if(done.length)kids.push(node('d'+g.id,'','完了済み','',done.map(tnode)));

  const loose=S.tasks.filter(t=>!t.goal&&!t.done);

  return `<h2>目標マインドマップ <span class="muted">— ノードをクリックで展開／たたむ</span>

   <p class="muted">目標の中に「中期目標」「短期目標」「タスク」を足すときは、目標をクリックして開くと一番下に入力欄があります。消したいものは × を押します。日付をクリックすると期限を変更できます。</p>

wbs(){

  const keys={goal:t=>(S.goals.findIndex(g=>g.id==t.goal)+1||999),pri,due:t=>t.due||'9999',status:t=>t.done?1:0,title:t=>t.title};
  let ts=S.tasks.filter(t=>SHOWDONE||!t.done);
  ts=ts.slice().sort((a,b)=>{const x=keys[SORT](a),y=keys[SORT](b);return x<y?-1:x>y?1:(a.due||'9999')<(b.due||'9999')?-1:1});

    const late=t.due&&t.due<today()&&!t.done;
    rows+=`<tr class="${t.done?'done':''}"><td><input type="checkbox" ${t.done?'checked':''} onchange="toggle('${t.id}')"> <span class="t">${t.cat&&CATS[t.cat]?`<span class="cdot" ${catStyle(t)}></span>`:''}${qb(t)}${ed('t',t.id,t.title)}</span></td>
     <td>${t.goal?`<span class="tag">${esc(goalName(t.goal)+subName(t))}</span>`:'—'}</td>
     <td><select onchange="setPri('${t.id}',this.value)">${[1,2,3,4].map(n=>`<option value="${n}" ${pri(t)==n?'selected':''}>${PL[n]}</option>`).join('')}</select></td>

     <td>${t.done?'完了':t.started?'🔶 着手中':late?'<span style="color:var(--warn)">遅れ</span>':t.mit===today()?'★今日':'未着手'}</td></tr>`});

   <label class="muted" style="margin-left:auto"><input type="checkbox" ${SHOWDONE?'checked':''} onchange="SHOWDONE=this.checked;render()"> 完了も表示</label></div>

  <tbody>${rows||'<tr><td colspan="5" class="muted">タスクがありません</td></tr>'}</tbody></table></div>`;
},

function quickAdd(big){return `<div class="card row"><input id="qa" class="grow" placeholder="${big?'タスクを入力して Enter':'＋ 今日のタスクを追加'}" onkeydown="if(ent(event))addTask(this.value,document.getElementById('qg').value,document.getElementById('qd').value,${!big})"><select id="qg">${goalOpts()}</select><input id="qd" type="date">${big?`<select id="qr">${repOpts()}</select>`:''}<select id="qc">${catOpts()}</select><select id="qq" title="第何象限か">${qOpts()}</select></div>`}
function addTask(title,goal,due,isMit){if(!title.trim())return;const qr=document.getElementById('qr'),rep=qr?qr.value:'',qc=document.getElementById('qc'),cat=qc?qc.value:'',qq=document.getElementById('qq'),qv=qq?+qq.value:0;let sub='';[goal,sub]=(goal||'').split('|');S.tasks.push({id:id(),title:title.trim(),goal:goal||'',sub:sub||'',due:due||'',done:false,mit:isMit?today():'',repeat:rep,cat,urgent:qv?(qv==1||qv==3):false,important:qv?qv<=2:!!goal});save();setTimeout(()=>document.getElementById(goal&&tab=='goals'?'ga'+goal:'qa')?.focus())}
const REP={'':'🔁 なし',daily:'🔁 毎日',everyn:'🔁 ○日ごと',weekdays:'🔁 平日',weekly:'🔁 毎週',biweekly:'🔁 隔週',monthly:'🔁 毎月',yearly:'🔁 毎年'};
const WDN='日月火水木金土';let RPO='';
function repOpts(v){return Object.entries(REP).map(([k,l])=>`<option value="${k}" ${k==(v||'')?'selected':''}>${l}</option>`).join('')}
function baseDate(t){return new Date((t.due||today())+'T00:00')}
function repLabel(t){const r=t.repeat;if(!r)return '';
  if(r=='everyn')return `🔁 ${t.rn||2}日ごと`;
  if(r=='weekly'||r=='biweekly'){const ds=(t.rdays&&t.rdays.length?t.rdays:[baseDate(t).getDay()]).slice().sort();return `🔁 ${r=='weekly'?'毎週':'隔週'} ${ds.map(i=>WDN[i]).join('・')}`}
  if(r=='monthly'){const dt=t.rdate??baseDate(t).getDate();return `🔁 毎月${dt==0?'末日':dt+'日'}`}
  if(r=='yearly'){const b=baseDate(t);return `🔁 毎年${b.getMonth()+1}/${b.getDate()}`}
  return REP[r]}
function repPanel(t){const r=t.repeat||'',ds=t.rdays&&t.rdays.length?t.rdays:[baseDate(t).getDay()],dt=t.rdate??baseDate(t).getDate();
  return `<div class="rpp"><div class="row"><b>繰り返し</b><select onchange="setT('${t.id}','repeat',this.value)">${repOpts(r)}</select><button class="ghost" style="margin-left:auto" onclick="RPO='';render()">閉じる</button></div>
  ${r=='everyn'?`<div class="row"><input type="number" min="1" max="365" value="${t.rn||2}" style="width:80px" onchange="setT('${t.id}','rn',Math.max(1,+this.value||1))"> 日ごと</div>`:''}
  ${r=='weekly'||r=='biweekly'?`<div class="row">曜日：${[1,2,3,4,5,6,0].map(i=>`<button class="wdb ${ds.includes(i)?'on':''} ${i==0?'sun':i==6?'sat':''}" onclick="togDay('${t.id}',${i})">${WDN[i]}</button>`).join('')}</div>`:''}
  ${r=='monthly'?`<div class="row">毎月 <select onchange="setT('${t.id}','rdate',+this.value)">${[...Array(31)].map((_,i)=>`<option value="${i+1}" ${dt==i+1?'selected':''}>${i+1}日</option>`).join('')}<option value="0" ${dt==0?'selected':''}>末日</option></select> <span class="muted">（31日など無い月は末日）</span></div>`:''}
  ${r?`<div class="muted">次の予定：完了すると ${nextDue(t.due||today(),t).replace(/-/g,'/')} に次のタスクができます</div>`:''}</div>`}
function togDay(i,d){const t=S.tasks.find(t=>t.id==i);let ds=t.rdays&&t.rdays.length?t.rdays.slice():[baseDate(t).getDay()];ds=ds.includes(d)?ds.filter(x=>x!=d):[...ds,d];if(!ds.length)return;t.rdays=ds;save()}
function nextDue(base,t){const r=typeof t=='string'?t:t.repeat;t=typeof t=='string'?{}:t;
  const d=new Date((base>today()?base:today())+'T00:00'),b=new Date(base+'T00:00');
  if(r=='daily')d.setDate(d.getDate()+1);

  if(r=='weekdays'){do d.setDate(d.getDate()+1);while(d.getDay()==0||d.getDay()==6)}
  if(r=='weekly'||r=='biweekly'){const ds=t.rdays&&t.rdays.length?t.rdays:[b.getDay()];if(r=='biweekly')d.setDate(d.getDate()+7);do d.setDate(d.getDate()+1);while(!ds.includes(d.getDay()))}
  if(r=='monthly'){const want=t.rdate??b.getDate(),pick=(y,m)=>{const last=new Date(y,m+1,0).getDate();return new Date(y,m,want==0?last:Math.min(want,last))};

function slotOn(t){return t.slot&&t.slot.date==today()}
// 重なった予定は横に並べ、右が空いていれば広げる（Googleカレンダー風）
function layout(list){const items=list.slice().sort((a,b)=>a.s-b.s||b.e-a.e),LAY={},NAR={};let cl=[],cEnd=-1;
  const flush=()=>{const n=Math.max(...cl.map(x=>x.col))+1;cl.forEach(x=>{let sp=1;while(x.col+sp<n&&!cl.some(y=>y.col==x.col+sp&&y.s<x.e&&y.e>x.s))sp++;
    NAR[x.k]=sp*100/n<50;LAY[x.k]=`left:calc(${x.col*100/n}% + 1px);width:calc(${sp*100/n}% - 3px);right:auto;`});cl=[]};
  items.forEach(it=>{if(cl.length&&it.s>=cEnd){flush();cEnd=-1}const used=cl.filter(x=>x.e>it.s).map(x=>x.col);let c=0;while(used.includes(c))c++;it.col=c;cl.push(it);cEnd=Math.max(cEnd,it.e)});if(cl.length)flush();return {LAY,NAR}}

     <b>${QN[qOf(t)]} ${esc(t.title)}</b><small class="bt">${fm(t.slot.start)}–${fm(t.slot.end)}</small>

// ===== Googleカレンダーの予定を取り込む（読み込みのみ・非公開iCal URL） =====
let GEV=[],GALL=[],gstate='',icsDay='',icsAt='';
const GCOL=['#7b8794','#d50000','#1a4fd6','#e67c73','#f6bf26','#33b679','#039be5','#7986cb','#8e24aa','#f4511e','#616161','#d81b60'];
function icsCol(c,i){return c.color||GCOL[i%GCOL.length]}
function icsList(){if(S.icsUrl&&!S.icsUrls){S.icsUrls=[{url:S.icsUrl,name:''}]}delete S.icsUrl;return S.icsUrls||(S.icsUrls=[])}
function loadICAL(){return window.ICAL?Promise.resolve():new Promise((ok,ng)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js';sc.onload=ok;sc.onerror=ng;document.head.appendChild(sc)})}
let icsTs=0;
let ICSC=[];
async function icsLoad(force){if(!icsList().length||SAMPLE)return;if(!force&&icsDay==today()&&Date.now()-icsTs<10*60e3)return;icsDay=today();icsTs=Date.now();if(force)gstate='読み込み中…';render();
  let fail=0,dirty=false;const out=[];
  try{await loadICAL();
   for(const [ci,c] of icsList().entries()){try{const r=await fetch('/api/ics?url='+encodeURIComponent(c.url));if(!r.ok)throw new Error(r.status);
    const comp=new ICAL.Component(ICAL.parse(await r.text()));comp.getAllSubcomponents('vtimezone').forEach(tz=>{try{ICAL.TimezoneService.register(tz)}catch(e){}});
    const nm=comp.getFirstPropertyValue('x-wr-calname');if(nm&&c.name!==nm){c.name=nm;dirty=true}
    const vs=comp.getAllSubcomponents('vevent'),ex={};vs.forEach(v=>{if(v.hasProperty('recurrence-id')){const u=v.getFirstPropertyValue('uid');(ex[u]=ex[u]||[]).push(v)}});
    const evs=vs.filter(v=>!v.hasProperty('recurrence-id')&&(v.getFirstPropertyValue('status')||'')!='CANCELLED').map(v=>{const e=new ICAL.Event(v);(ex[e.uid]||[]).forEach(x=>{try{e.relateException(x)}catch(_){}});return e});
    out.push({evs,col:icsCol(c,ci),name:c.name||''})}catch(e1){fail++;console.error(e1)}}
   ICSC=out;if(dirty)saveQ();
   const d0=new Date();d0.setHours(0,0,0,0);const d1=new Date(d0);d1.setDate(d1.getDate()+1);const r=evIn(d0,d1);
   GEV=r.ev.map(x=>({...x,s:Math.max(TL0,x.s),e:Math.min(TL1,x.e)})).filter(x=>x.e>x.s).sort((a,b)=>a.s-b.s);GALL=r.all;
   gstate=fail?`⚠ ${fail}件読み込めず`:'';const n=new Date();icsAt=n.getHours()+':'+String(n.getMinutes()).padStart(2,'0');}
  catch(err){GEV=[];GALL=[];gstate='⚠ 読み込めませんでした';console.error(err)}
  render()}
// 指定期間のGoogle予定を日ごとに切り出す
function evIn(d0,d1){const ev=[],all=[];
  for(const cal of ICSC){const add=(sum,st,en,isDate)=>{const a=st.toJSDate();let b=en?en.toJSDate():a;if(isDate&&b<=a)b=new Date(a.getTime()+864e5);if(b<=d0||a>=d1)return;
      const day=new Date(Math.max(a,d0));day.setHours(0,0,0,0);
      for(;day<d1&&day<b;day.setDate(day.getDate()+1)){const nx=new Date(day);nx.setDate(nx.getDate()+1);
        if(isDate){all.push({t:sum,c:cal.col,date:ymd(day)});continue}
        const s0=a>day?a.getHours()*60+a.getMinutes():0,e0=b<nx?b.getHours()*60+b.getMinutes():1440;if(e0>s0)ev.push({t:sum,c:cal.col,n:cal.name,date:ymd(day),s:s0,e:e0})}};
    for(const e of cal.evs){try{
      if(e.isRecurring()){const it=e.iterator();let t,n=0;while((t=it.next())&&n++<5000){const od=e.getOccurrenceDetails(t),a=od.startDate.toJSDate();if(a>=d1)break;
          if((od.item.component.getFirstPropertyValue('status')||'')=='CANCELLED')continue;if(od.endDate&&od.endDate.toJSDate()<=d0)continue;add(od.item.summary||'(予定)',od.startDate,od.endDate,od.startDate.isDate)}}
      else add(e.summary||'(予定)',e.startDate,e.endDate,e.startDate.isDate)}catch(_){}}}
  return {ev,all}}

  if(!v)return;const L=icsList();if(L.some(c=>c.url==v)){alert('このカレンダーは追加済みです');return}L.push({url:v,name:''});GEV=[];GALL=[];icsDay='';save();icsLoad(true);openSet()}

let TP='';
// 時間選択の欄は、欄の外をタップすると閉じる
document.addEventListener('click',e=>{if(!TP)return;const el=e.target;if(el.closest&&(el.closest('#tpp')||el.closest('.tpb')||el.closest('.blk')))return;TP='';render()},true);
function openTP(id){TP=id;render();setTimeout(()=>{const b=document.querySelector(`.blk[data-id="${id}"]`)||document.getElementById('tl');b?.scrollIntoView({block:'center',behavior:'smooth'})},30)}
function tpPanel(){const t=S.tasks.find(x=>x.id==TP);if(!t)return '';
  const n=new Date(),nowm=Math.ceil((n.getHours()*60+n.getMinutes())/15)*15;
  const st=slotOn(t)?t.slot.start:Math.min(TL1-60,Math.max(TL0,nowm)),len=slotOn(t)?t.slot.end-t.slot.start:60;
  const opts=[];for(let m=TL0;m<TL1;m+=15)opts.push(`<option value="${m}" ${m==st?'selected':''}>${fm(m)}</option>`);
  const lens=[15,30,45,60,90,120,150,180,240];if(!lens.includes(len))lens.push(len);lens.sort((a,b)=>a-b);
  return `<div class="tpp" id="tpp"><div><b>${esc(t.title)}</b> の時間</div>
   <div class="row">開始 <select id="tps" onchange="liveTP()">${opts.join('')}</select> 長さ <select id="tpl" onchange="liveTP()">${lens.map(l=>`<option value="${l}" ${l==len?'selected':''}>${l<60?l+'分':l%60?Math.floor(l/60)+'時間'+l%60+'分':l/60+'時間'}</option>`).join('')}</select></div>
   <p class="muted" style="margin:0;font-size:12px">選ぶとすぐカレンダーに反映されます。カレンダーを見ながら調整できます。</p><div class="row"><button class="btn" onclick="setTP()">決定</button>${slotOn(t)?`<button class="ghost" onclick="TP='';unslot('${t.id}')">カレンダーから外す</button>`:''}<button class="ghost" onclick="TP='';render()">閉じる</button></div></div>`}
function liveTP(){const t=S.tasks.find(x=>x.id==TP);if(!t)return;const s0=+tps.value,l=+tpl.value;t.slot={date:today(),start:s0,end:Math.min(TL1,s0+l)};if(t.mit!==today())t.mit=today();save();
  setTimeout(()=>document.querySelector(`.blk[data-id="${t.id}"]`)?.scrollIntoView({block:'center',behavior:'smooth'}),30)}
function setTP(){const t=S.tasks.find(x=>x.id==TP);const s0=+tps.value,l=+tpl.value;t.slot={date:today(),start:s0,end:Math.min(TL1,s0+l)};if(t.mit!==today())t.mit=today();TP='';save()}
function unslot(i){const t=S.tasks.find(t=>t.id==i);if(t.habit){S.tasks=S.tasks.filter(x=>x!==t);save();return}t.slot=null;save()}
function dstart(e,id,mode){if(e.button>0)return;e.preventDefault();const t=S.tasks.find(t=>t.id==id);
  DR={id,mode,y0:e.clientY,orig:t.slot?{...t.slot}:null,el:mode=='new'?null:document.querySelector(`.blk[data-id="${id}"]`),cur:null};
  if(mode=='new'){const g=document.createElement('div');g.className='ghost-drag';g.textContent=t.title;document.body.appendChild(g);DR.ghost=g;mvGhost(e)}
  window.addEventListener('pointermove',dmove);window.addEventListener('pointerup',dend,{once:true})}
function mvGhost(e){DR.ghost.style.left=e.clientX+8+'px';DR.ghost.style.top=e.clientY+8+'px'}
function minAt(y){const r=document.getElementById('tlg').getBoundingClientRect();return Math.round((TL0+(y-r.top)/PPM)/SNAP)*SNAP}
function overTL(e){const tl=document.getElementById('tl');if(!tl)return false;const r=tl.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom}
function autoScroll(e){const tl=document.getElementById('tl');if(!tl)return;const r=tl.getBoundingClientRect();if(e.clientY<r.top+30)tl.scrollTop-=12;if(e.clientY>r.bottom-30)tl.scrollTop+=12}
function dmove(e){if(!DR)return;
  if(DR.mode=='new'){mvGhost(e);document.getElementById('tl')?.classList.toggle('over',overTL(e));if(overTL(e))autoScroll(e);return}
  autoScroll(e);const d=Math.round((e.clientY-DR.y0)/PPM/SNAP)*SNAP,o=DR.orig;let s0=o.start,e0=o.end;
  if(DR.mode=='move'){const len=e0-s0;s0=Math.min(TL1-len,Math.max(TL0,s0+d));e0=s0+len}else e0=Math.min(TL1,Math.max(s0+SNAP,e0+d));
  DR.cur={...o,start:s0,end:e0};DR.el.style.top=(s0-TL0)*PPM+'px';DR.el.style.height=Math.max(MINH,(e0-s0)*PPM)+'px';DR.el.classList.toggle('short',e0-s0<=(ZOOM=='all'?60:30));DR.el.querySelector('.bt').textContent=fm(s0)+'–'+fm(e0)}
function dend(e){window.removeEventListener('pointermove',dmove);const D=DR;DR=null;if(!D)return;const t=S.tasks.find(t=>t.id==D.id);
  if(D.mode=='new'){D.ghost.remove();document.getElementById('tl')?.classList.remove('over');
    if(overTL(e)){let m=Math.min(TL1-60,Math.max(TL0,minAt(e.clientY)));t.slot={date:today(),start:m,end:m+60};if(t.mit!==today())t.mit=today();save()}return}
  if(D.cur&&(D.cur.start!=D.orig.start||D.cur.end!=D.orig.end)){t.slot=D.cur;save()}
  else if(D.mode=='move'&&Math.abs(e.clientY-D.y0)<4)openTP(D.id)}

  fbDoc.set({data:JSON.stringify(S),updatedAt:S.updatedAt||Date.now(),device:DEVICE}).then(()=>{syncState='☁ 同期済み';acctUI()}).catch(e=>{syncState='⚠ 同期エラー';acctUI();console.error(e)})},800)}

function hasData(x){return x&&((x.tasks||[]).length||(x.goals||[]).length||(x.habits||[]).length)}
function initSync(){if(SAMPLE||!FB_CONFIG.apiKey||!window.firebase)return;
  firebase.initializeApp(FB_CONFIG);
  firebase.auth().onAuthStateChanged(async u=>{fbUser=u;if(fbDoc&&fbDoc._unsub)fbDoc._unsub();fbDoc=null;
    if(!u){syncState='';acctUI();return}
    syncState='読み込み中…';acctUI();
    const ref=firebase.firestore().collection('users').doc(u.uid);
    try{const snap=await ref.get();fbDoc=ref;
      if(S.owner&&S.owner!==u.uid){S=EMPTY()}
      S.owner=u.uid;

        if(!hasData(S)||(r.updatedAt||0)>(S.updatedAt||0)){remote.owner=u.uid;S=remote;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
        else pushSoon()}

      ref._unsub=ref.onSnapshot(sn=>{if(!sn.exists)return;const r=sn.data();
